[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parallax-omega-agent"
version = "1.0.0rc3"
description = "Proof-carrying control plane for ChatGPT and OpenAI agents"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "PARALLAX Ω contributors"}]
keywords = ["agents", "governance", "openai", "mcp", "safety", "receipts"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
runtime = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
]
openai = [
  "openai>=1.60,<3",
  "openai-agents>=0.2,<1",
  "mcp>=1.0,<2",
]
dev = [
  "build>=1.2,<2",
  "pytest>=9.0.3,<10",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "pyyaml>=6,<7",
  "pip-audit>=2.8,<3",
]


[tool.setuptools]
package-dir = {"" = "runtime"}

[tool.setuptools.packages.find]
where = ["runtime"]

[tool.setuptools.package-data]
parallax_omega = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# UP042 would migrate the `(str, Enum)` classes in models.py and policy.py to `StrEnum`.
# That changes `str(RiskLevel.R0)` from "RiskLevel.R0" to "R0", and those members are
# serialized into action fingerprints, receipt payloads, and the receipt chain hash. The
# migration is therefore a deliberate, separately tested change and not a lint cleanup.
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
# These modules must extend sys.path before importing the package under test or the
# sibling script module, so imports cannot all precede executable statements.
"tests/*" = ["E402"]
"scripts/build_release.py" = ["E402"]
"scripts/validate_package.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["runtime", "."]

[tool.uv]
required-version = "==0.10.0"
resolution = "highest"
