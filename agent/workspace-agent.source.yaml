# Human-maintained source descriptor. This is not a direct import manifest and
# does not prove that ChatGPT accepted, published, invoked, or verified the agent.
api_version: parallax.openai/v1alpha2
kind: WorkspaceAgentSourceDescriptor
metadata:
  name: parallax-omega
  version: 1.0.0-rc.2
  built_at: 2026-07-28
spec:
  display_name: PARALLAX Ω
  description: Proof-carrying evidence, host-governed action, and verifiable receipts.
  instructions: agent/WORKSPACE_AGENT_INSTRUCTIONS.md
  files:
    include:
      - knowledge/
    policy: curated-minimum-only
  skills:
    archives: dist/skills/*/skill.zip
  tools:
    web_search: optional
    image_generation: disabled_by_default
    custom_mcp: optional_after_security_review
  connections:
    prefer: end_user_account
    agent_owned: dedicated_service_account_only
    write_approval: always
    parameter_constraints: required_for_write_capable_connectors
  channels:
    chatgpt: restricted-pilot-first
    slack: disabled_until_owner_and_scope_review
    api_trigger: optional_after_publish
  schedules:
    enabled: false
  memory:
    mode: disabled_until_consent_backend_verified
  observability:
    redact_sensitive_trace_data: true
    require_version_and_effect_receipt: true
  status: packaged-not-deployed-not-live-verified
