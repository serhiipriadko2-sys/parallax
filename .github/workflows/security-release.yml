name: security release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-attest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: constraints/all.lock
      - run: python -m pip install --require-hashes -r constraints/all.lock
      - run: python -m pip install --no-deps -e .
      - run: pip-audit -r constraints/all.lock --strict
      - run: python scripts/run_tests.py --profile openai
      - run: python scripts/tool_manifest.py verify
      - run: python scripts/skill_manifest.py verify
      - run: python scripts/build_release.py --output ../parallax-omega-agent-stack-rc3.zip
      - name: Attest release, SBOM, MCP manifest, and Skill allowlist
        uses: actions/attest-build-provenance@v4.1.0
        with:
          subject-path: |
            ../parallax-omega-agent-stack-rc3.zip
            constraints/sbom.cdx.json
            mcp/tool-manifest.json
            governance/ALLOWED_SKILLS.json
