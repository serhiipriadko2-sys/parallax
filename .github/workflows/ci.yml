name: ci

on:
  pull_request:
  push:
    branches: [main, security/rc3-hardening]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core-py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: constraints/dev.lock
      - name: Install hash-locked core tooling
        run: python -m pip install --require-hashes -r constraints/dev.lock
      - run: PYTHONDONTWRITEBYTECODE=1 python scripts/run_tests.py --profile core
      - run: python scripts/run_evals.py
      - run: python scripts/validate_package.py --skip-ledger
      - run: python scripts/secret_scan.py
      - run: python scripts/tool_manifest.py verify
      - run: python scripts/skill_manifest.py verify

  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: constraints/runtime-dev.lock
      - run: python -m pip install --require-hashes -r constraints/runtime-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: PYTHONDONTWRITEBYTECODE=1 python scripts/run_tests.py --profile runtime
      # The editable install writes runtime/*.egg-info, which the release hygiene check
      # correctly rejects as generated noise. Remove it first, as the release procedure
      # already does for __pycache__, so the check sees the release tree and not build output.
      - name: Remove build metadata before release hygiene check
        run: rm -rf runtime/*.egg-info
      - run: python scripts/validate_package.py --skip-ledger
      - run: ruff check runtime tests scripts agents_sdk adapters
      - run: mypy runtime/parallax_omega

  optional-openai-surfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: constraints/all.lock
      - run: python -m pip install --require-hashes -r constraints/all.lock
      - run: python -m pip install --no-deps -e .
      - run: PYTHONDONTWRITEBYTECODE=1 python scripts/run_tests.py --profile openai
      - run: PYTHONDONTWRITEBYTECODE=1 python scripts/verify_optional_surfaces.py --require all

  dependency-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: constraints/all.lock
      - run: python -m pip install --require-hashes -r constraints/all.lock
      - name: Audit locked dependency set
        run: pip-audit -r constraints/all.lock --strict
      - name: Verify committed lock exports
        run: |
          python -m pip install uv==0.10.0
          uv lock --check
          uv export --frozen --extra dev --no-emit-project --no-header --output-file /tmp/dev.lock
          uv export --frozen --extra runtime --extra dev --no-emit-project --no-header --output-file /tmp/runtime-dev.lock
          uv export --frozen --all-extras --no-emit-project --no-header --output-file /tmp/all.lock
          uv export --frozen --all-extras --no-emit-project --format cyclonedx1.5 --output-file /tmp/sbom.cdx.json
          cmp /tmp/dev.lock constraints/dev.lock
          cmp /tmp/runtime-dev.lock constraints/runtime-dev.lock
          cmp /tmp/all.lock constraints/all.lock
          python scripts/compare_sbom.py constraints/sbom.cdx.json /tmp/sbom.cdx.json
