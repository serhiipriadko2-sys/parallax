name: refresh dependency lock

on:
  workflow_dispatch:
  push:
    branches: [security/rc3-hardening]
    paths:
      - pyproject.toml
      - .github/workflows/refresh-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Resolve and export immutable dependency evidence
        run: |
          python -m pip install uv==0.10.0
          uv lock
          mkdir -p constraints
          uv export --frozen --extra dev --no-emit-project --no-header --output-file constraints/dev.lock
          uv export --frozen --extra runtime --extra dev --no-emit-project --no-header --output-file constraints/runtime-dev.lock
          uv export --frozen --all-extras --no-emit-project --no-header --output-file constraints/all.lock
          uv export --frozen --all-extras --no-emit-project --format cyclonedx1.5 --output-file constraints/sbom.cdx.json
      - name: Commit generated lock and SBOM
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uv.lock constraints/dev.lock constraints/runtime-dev.lock constraints/all.lock constraints/sbom.cdx.json
          if git diff --cached --quiet; then
            echo "Lock artifacts already current"
          else
            git commit -m "chore(security): refresh hashed dependency lock and SBOM"
            git push origin HEAD:${{ github.ref_name }}
          fi
